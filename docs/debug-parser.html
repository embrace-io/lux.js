<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>SpeedCurve RUM Debug Parser</title>
    <style>
        :root {
            --bg: #f3f7f9;
            --surface: #ffffff;
            --surface-alt: #f7f9fb;
            --border: #d9e1e7;
            --text: #1c2730;
            --muted: #62717d;
            --accent: #0a7ea4;
            --accent-text: #ffffff;
            --pageview: #6f3fb5;
            --beacon: #0b8a5a;
            --error: #c62828;
            --error-bg: #fdecec;
            --warn: #b26a00;
            --warn-bg: #fff4e0;
            --metric: #3f6fb5;
            --api: #2f8f8f;
            --verbose: #9aa7b1;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --radius: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
            --bg: #10161b;
            --surface: #1a2228;
            --surface-alt: #202a31;
            --border: #2e3a43;
            --text: #e6edf2;
            --muted: #93a1ac;
            --accent: #3fb3dc;
            --accent-text: #08141a;
            --pageview: #b592ee;
            --beacon: #4dd39a;
            --error: #ff7b7b;
            --error-bg: #3a1d1d;
            --warn: #ffb74d;
            --warn-bg: #3a2c14;
            --metric: #7fa7e6;
            --api: #5ec4c4;
            --verbose: #6d7a84;
            }
        }

        :root[data-theme="dark"] {
            --bg: #10161b;
            --surface: #1a2228;
            --surface-alt: #202a31;
            --border: #2e3a43;
            --text: #e6edf2;
            --muted: #93a1ac;
            --accent: #3fb3dc;
            --accent-text: #08141a;
            --pageview: #b592ee;
            --beacon: #4dd39a;
            --error: #ff7b7b;
            --error-bg: #3a1d1d;
            --warn: #ffb74d;
            --warn-bg: #3a2c14;
            --metric: #7fa7e6;
            --api: #5ec4c4;
            --verbose: #6d7a84;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            padding: 0 16px 120px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.45;
        }

        .container {
            margin: 0 auto;
            max-width: 1080px;
        }

        .page-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            margin: 2rem 0 0.25rem;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0;
        }

        .theme-select {
            font: inherit;
            font-size: 0.85rem;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.25rem 0.4rem;
        }

        h2 {
            font-size: 1.05rem;
            margin: 0;
        }

        code {
            font-family: var(--mono);
            font-size: 0.9em;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0 0.3em;
        }

        pre {
            font-family: var(--mono);
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }

        .intro {
            color: var(--muted);
            margin: 0 0 1.5rem;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1rem;
        }

        .panel > summary {
            cursor: pointer;
            font-weight: 600;
            padding: 0.75rem 1rem;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .panel > summary::-webkit-details-marker {
            display: none;
        }

        .panel > summary::before {
            content: "";
            width: 0.45em;
            height: 0.45em;
            border-right: 2px solid var(--muted);
            border-bottom: 2px solid var(--muted);
            transform: rotate(-45deg);
            transition: transform 0.15s;
        }

        .panel[open] > summary::before {
            transform: rotate(45deg);
        }

        .panel-body {
            padding: 0 1rem 1rem;
        }

        .hint {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0 0 0.75rem;
        }

        .muted {
            color: var(--muted);
            font-weight: normal;
        }

        textarea {
            display: block;
            width: 100%;
            height: 260px;
            padding: 0.75rem;
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text);
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
        }

        textarea:focus, input:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.75rem;
        }

        button {
            font: inherit;
            font-size: 0.9rem;
            padding: 0.45rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        button:hover {
            background: var(--surface-alt);
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-text);
            font-weight: 600;
        }

        .error {
            background: var(--error-bg);
            border: 1px solid var(--error);
            border-radius: var(--radius);
            color: var(--error);
            padding: 0.75rem 1rem;
            margin: 0 0 1rem;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem 1rem;
            margin-bottom: 0.75rem;
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem 1rem;
            flex: 1 1 320px;
            font-size: 0.9rem;
        }

        .summary-warn { color: var(--warn) }
        .summary-error { color: var(--error) }
        .summary-muted { color: var(--muted) }

        input[type="search"] {
            font: inherit;
            font-size: 0.9rem;
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            min-width: 200px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem 1.25rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .filters label {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            cursor: pointer;
        }

        .page-view {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1.25rem;
            overflow: hidden;
        }

        .page-view-header {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.4rem 1rem;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
        }

        .badge {
            display: inline-block;
            margin-left: 0.6rem;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--pageview);
            border: 1px solid currentColor;
            vertical-align: middle;
        }

        .status {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-sent { color: var(--beacon) }
        .status-unsent { color: var(--warn) }

        .page-view-meta {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 1.5rem;
            margin: 0;
            font-size: 0.85rem;
        }

        .page-view-meta dt {
            display: inline;
            color: var(--muted);
        }

        .page-view-meta dt::after {
            content: " ";
        }

        .page-view-meta dd {
            display: inline;
            margin: 0 0 0 0.2rem;
        }

        .page-view-meta dt,
        .page-view-meta dd {
            white-space: nowrap;
        }

        .events {
            list-style: none;
            margin: 0;
            padding: 0.25rem 0;
        }

        .event {
            display: grid;
            grid-template-columns: 6.5rem 4rem 1fr;
            gap: 0 0.75rem;
            padding: 0.3rem 1rem 0.3rem 0.75rem;
            border-left: 4px solid transparent;
            align-items: baseline;
        }

        .event:hover {
            background: var(--surface-alt);
        }

        .event-time {
            font-family: var(--mono);
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
            text-align: right;
            color: var(--muted);
        }

        .event-delta {
            font-family: var(--mono);
            font-size: 0.75rem;
            font-variant-numeric: tabular-nums;
            text-align: right;
            color: var(--verbose);
        }

        .event-delta-large {
            color: var(--warn);
            font-weight: 600;
        }

        .event-body {
            min-width: 0;
            word-break: break-word;
        }

        .event-note {
            margin-left: 0.6rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .event-pageview { border-left-color: var(--pageview) }
        .event-pageview .event-message { font-weight: 600; color: var(--pageview) }
        .event-beacon { border-left-color: var(--beacon) }
        .event-beacon .event-message { font-weight: 600; color: var(--beacon) }
        .event-error { border-left-color: var(--error); background: var(--error-bg) }
        .event-error .event-message { color: var(--error); font-weight: 600 }
        .event-warn { border-left-color: var(--warn); background: var(--warn-bg) }
        .event-warn .event-message { color: var(--warn) }
        .event-metric { border-left-color: var(--metric) }
        .event-api { border-left-color: var(--api) }
        .event-api .event-message { font-family: var(--mono); font-size: 0.85rem }
        .event-verbose .event-message { color: var(--muted) }

        .event-warning-row .event-time,
        .event-warning-row .event-delta {
            visibility: hidden;
        }

        .event-warning-row .event-message::before {
            content: "Warning: ";
            font-weight: 600;
        }

        .events-empty {
            padding: 0.75rem 1rem;
            color: var(--muted);
        }

        .event-details {
            margin-top: 0.25rem;
            font-size: 0.85rem;
        }

        .event-details > summary {
            cursor: pointer;
            color: var(--accent);
            font-weight: 500;
            width: fit-content;
        }

        .event-details[open] > summary {
            margin-bottom: 0.5rem;
        }

        .event-details > :not(summary) {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem 0.75rem;
            margin-bottom: 0.5rem;
            max-height: 420px;
            overflow: auto;
        }

        .details-list {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 0.15rem 1rem;
            margin: 0;
        }

        .details-list dt {
            color: var(--muted);
            white-space: nowrap;
        }

        .details-list dd {
            margin: 0;
            word-break: break-all;
        }

        @media (max-width: 640px) {
            .event {
                grid-template-columns: 5rem 1fr;
            }

            .event-delta {
                display: none;
            }

            .page-view-header {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>SpeedCurve RUM Debug Parser</h1>
            <select class="theme-select" id="theme" aria-label="Theme">
                <option value="">Theme: System</option>
                <option value="light">Theme: Light</option>
                <option value="dark">Theme: Dark</option>
            </select>
        </div>
        <p class="intro">Turns the output of <code>LUX.getDebug()</code> into a readable timeline of what lux.js did on the page.</p>

        <details class="panel" id="input-section" open>
            <summary>Debug output <span class="muted" id="input-summary"></span></summary>
            <div class="panel-body">
                <p class="hint">Run <code>copy(LUX.getDebug())</code> in the DevTools console to copy the output to your clipboard, then paste it below. The input is remembered in this browser.</p>
                <textarea id="input" spellcheck="false" placeholder="[[1700000000000, 1, [&quot;4.5.3&quot;, ...]], ...]"></textarea>
                <div class="actions">
                    <button id="clear" type="button">Clear</button>
                    <button id="parse" type="button" class="primary">Parse</button>
                </div>
            </div>
        </details>

        <p class="error" id="error" hidden></p>

        <section id="results" hidden>
            <div class="toolbar">
                <div class="summary" id="summary"></div>
                <input type="search" id="search" placeholder="Search events" aria-label="Search events">
                <button id="copy" type="button">Copy as text</button>
            </div>

            <div class="filters">
                <label><input type="checkbox" checked class="event-filter" data-event="metrics"> Performance entries</label>
                <label><input type="checkbox" checked class="event-filter" data-event="addData"> <code>LUX.addData()</code></label>
                <label><input type="checkbox" checked class="event-filter" data-event="userTiming"> <code>LUX.mark/measure()</code></label>
                <label><input type="checkbox" class="event-filter" data-event="verbose"> Verbose events</label>
                <label><input type="checkbox" class="event-filter" data-event="beaconUrl"> Beacon URLs</label>
            </div>

            <div id="output"></div>
        </section>
    </div>

    <script src="debug-parser.js"></script>
</body>
</html>
